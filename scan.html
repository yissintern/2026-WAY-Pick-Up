<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>WAY | Student ID Pickup</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3fa;color:#153253;font:16px system-ui,sans-serif}main{max-width:540px;margin:24px auto;padding:16px}header{background:#002d62;color:white;padding:24px;border-radius:16px 16px 0 0}section{background:white;padding:24px;border-bottom:1px solid #dce5ef}h1{font-size:27px;margin:10px 0}label{display:block;margin:14px 0 5px;font-weight:600}input,button{font:inherit;width:100%;padding:13px;border-radius:8px;border:1px solid #aabbd0}button{background:#002d62;color:white;border:0;margin-top:12px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#msg{white-space:pre-wrap;color:#953b22}#detail{white-space:pre-wrap;line-height:1.7}#table{font-size:42px;font-weight:800;text-align:center;background:#e5effb;border-radius:10px;padding:16px}#qr{display:flex;justify-content:center;margin:20px 0}footer{text-align:center;padding:20px;font-size:13px;color:#52647a}[hidden]{display:none!important}</style></head><body><main><header><small>YONSEI UNIVERSITY · WINTER ABROAD AT YONSEI</small><h1 id="title">Student ID Card Pickup</h1><div id="event"></div></header><section><form id="login"><label for="pw">Staff password</label><input id="pw" type="password" required autocomplete="current-password"><button id="loginBtn">Sign in</button></form><p id="msg" role="status"></p><div id="staff" hidden><p id="stats"></p><button id="stat">Refresh progress</button><button id="start">Start camera</button><button id="stop">Stop camera</button><div id="reader"></div><label for="qrfile">Or scan a QR image</label><input id="qrfile" type="file" accept="image/*"><button id="logout">Sign out</button></div></section><section id="result" hidden><div id="table"></div><p id="detail"></p><button id="commit">Confirm physical handover</button><button id="next">Next student</button></section><footer>Authorized WAY staff only</footer></main><script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script>const URL='https://script.google.com/macros/s/AKfycbzkt1xtX_ZZcofKGXNbkvzQiX_A4CFec4jZT_HtfjMLYmwyzNM7gtQBdAde0Ec9kjYUMg/exec';const $=id=>document.getElementById(id);function msg(t){$('msg').textContent=t}async function api(action,data={}){const r=await fetch(URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,...data}),credentials:'omit',redirect:'follow'});if(!r.ok)throw Error('Connection failed');const x=await r.json();if(!x.success)throw Error(x.error||'Request failed');return x}async function init(){try{const r=await fetch(URL,{credentials:'omit'});const x=await r.json();$('title').textContent=x.event_name||'Student ID Card Pickup';$('event').textContent=[x.event_date,x.event_location].filter(Boolean).join(' · ');if(!x.active)msg('Pickup is currently closed.')}catch(e){msg('Unable to reach server. Please retry.')}}init();let session='',qr='',scanner,busy=false,running=false;async function stats(){try{const x=await api('stats',{staff_token:session});$('stats').textContent=`Picked up: ${x.pickedUp} / ${x.total} · Remaining: ${x.remaining}`}catch(e){msg(e.message)}}$('login').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;try{const x=await api('verify',{password:$('pw').value});session=x.staff_token;$('pw').value='';$('login').hidden=true;$('staff').hidden=false;msg('Signed in');stats()}catch(e){msg(e.message)}finally{$('loginBtn').disabled=false}};async function stop(){if(running){await scanner.stop();running=false}}async function read(t){if(busy||!session||!$('result').hidden)return;busy=true;try{await stop();qr=t;const x=await api('scan',{staff_token:session,qr_token:qr});const s=x.student;$('table').textContent='TABLE '+s.table_number+' · BOX '+s.box_number;$('detail').textContent=[s.name,s.student_id,s.affiliation,s.already_picked_up?'Already picked up: '+s.picked_up_at:'Verify photo ID before handover.'].join('\n');$('commit').disabled=s.already_picked_up;$('result').hidden=false;msg('')}catch(e){msg(e.message)}finally{busy=false}}$('start').onclick=async()=>{if(running||busy||!$('result').hidden)return;try{scanner=scanner||new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:240},t=>read(t));running=true;msg('')}catch(e){msg('Camera unavailable. Check permission or use QR image.')}};$('stop').onclick=()=>stop().catch(e=>msg(e.message));$('qrfile').onchange=async e=>{try{await stop();scanner=scanner||new Html5Qrcode('reader');const f=e.target.files[0];if(f)await read(await scanner.scanFile(f,true))}catch(e){msg('Cannot read QR image')}finally{e.target.value=''}};$('commit').onclick=async()=>{if(busy)return;busy=true;$('commit').disabled=true;try{const x=await api('pickup',{staff_token:session,qr_token:qr});msg(x.recorded?'Pickup recorded successfully.':'Already recorded. Do not issue another card.');stats()}catch(e){msg(e.message+' — verify status before retrying.')}finally{busy=false}};$('next').onclick=()=>{if(busy)return;qr='';$('result').hidden=true;$('detail').textContent='';msg('Ready for next student. Start camera.')};$('stat').onclick=stats;$('logout').onclick=()=>location.reload();</script></body></html>
