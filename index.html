<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>WAY | Student ID Pickup</title><style>*{box-sizing:border-box}body{margin:0;background:#edf3fa;color:#153253;font:16px system-ui,sans-serif}main{max-width:540px;margin:24px auto;padding:16px}header{background:#002d62;color:white;padding:24px;border-radius:16px 16px 0 0}section{background:white;padding:24px;border-bottom:1px solid #dce5ef}h1{font-size:27px;margin:10px 0}label{display:block;margin:14px 0 5px;font-weight:600}input,button{font:inherit;width:100%;padding:13px;border-radius:8px;border:1px solid #aabbd0}button{background:#002d62;color:white;border:0;margin-top:12px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}#msg{white-space:pre-wrap;color:#953b22}#detail{white-space:pre-wrap;line-height:1.7}#table{font-size:42px;font-weight:800;text-align:center;background:#e5effb;border-radius:10px;padding:16px}#qr{display:flex;justify-content:center;margin:20px 0}footer{text-align:center;padding:20px;font-size:13px;color:#52647a}[hidden]{display:none!important}</style></head><body><main><header><small>YONSEI UNIVERSITY · WINTER ABROAD AT YONSEI</small><h1 id="title">Student ID Card Pickup</h1><div id="event"></div></header><section><p>Enter your registered email and date of birth to find your assigned pickup table.</p><form id="form"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"><label for="dob">Date of birth (YYMMDD)</label><input id="dob" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required placeholder="Example: 040105" autocomplete="off"><button id="go">Find my table</button></form><p id="msg" role="status"></p></section><section id="result" hidden><div id="table"></div><p id="detail"></p><div id="qr"></div><p id="expiry"></p><button id="refresh" hidden>Refresh pickup QR</button><p>Show your QR code and photo ID to staff. Do not share your QR code.</p><button id="reset">Clear my information</button></section><footer>WAY Office · iwinter@yonsei.ac.kr</footer></main><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script><script>const URL='https://script.google.com/macros/s/AKfycbzkt1xtX_ZZcofKGXNbkvzQiX_A4CFec4jZT_HtfjMLYmwyzNM7gtQBdAde0Ec9kjYUMg/exec';const $=id=>document.getElementById(id);function msg(t){$('msg').textContent=t}async function api(action,data={}){const r=await fetch(URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,...data}),credentials:'omit',redirect:'follow'});if(!r.ok)throw Error('Connection failed');const x=await r.json();if(!x.success)throw Error(x.error||'Request failed');return x}async function init(){try{const r=await fetch(URL,{credentials:'omit'});const x=await r.json();$('title').textContent=x.event_name||'Student ID Card Pickup';$('event').textContent=[x.event_date,x.event_location].filter(Boolean).join(' · ');if(!x.active)msg('Pickup is currently closed.')}catch(e){msg('Unable to reach server. Please retry.')}}init();let timer;async function lookup(){clearInterval(timer);$('go').disabled=true;$('refresh').disabled=true;$('result').hidden=true;msg('Checking…');try{const x=await api('lookup',{email:$('email').value,dob:$('dob').value});msg('');if(x.special){msg(x.message);return}const s=x.student;$('result').hidden=false;$('table').textContent='TABLE '+s.table_number;$('detail').textContent=[s.name,'Student ID: '+s.student_id,s.affiliation,s.already_picked_up?'Already picked up: '+s.picked_up_at:''].filter(Boolean).join('\n');$('qr').replaceChildren();$('refresh').hidden=!x.qr_token;$('expiry').textContent='';if(x.qr_token){new QRCode($('qr'),{text:x.qr_token,width:240,height:240});let end=Date.now()+45000;const tick=()=>{let left=Math.max(0,Math.ceil((end-Date.now())/1000));$('expiry').textContent=left?'Refresh within '+left+' seconds':'QR expired. Tap Refresh.';if(!left){$('qr').replaceChildren();clearInterval(timer)}};tick();timer=setInterval(tick,1000)}}catch(e){msg(e.message)}finally{$('go').disabled=false;$('refresh').disabled=false}}$('form').onsubmit=e=>{e.preventDefault();lookup()};$('refresh').onclick=lookup;$('reset').onclick=()=>{clearInterval(timer);$('form').reset();$('qr').replaceChildren();$('detail').textContent='';$('result').hidden=true;msg('')};</script></body></html>
